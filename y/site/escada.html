<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Merge Idle</title>
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #222;
        font-family: Arial, sans-serif;
        overflow: hidden;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
    }
    #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
    }
    #saldo_bar {
        flex: 0 0 auto;
        padding: 10px 14px;
        color: #fff;
        background-color: #333;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
    }
    #saldo {
        margin-left: auto;
        font-size: 26px;
        font-weight: bold;
        text-shadow: 0 0 3px black;
        word-break: break-all;
        text-align: right;
    }
    #saldo.confirmar {
        color: #ff5252;
    }
    #andares {
        flex: 1 1 auto;
        overflow-y: auto;
        display: flex;
        flex-direction: column-reverse; /* andar 1 fica embaixo, perto do clicker */
        align-items: center;
        gap: 8px;
        padding: 10px 0;
    }
    .andar {
        width: 80%;
        display: flex;
        gap: 8px;
        flex: 0 0 auto;
    }
    .btn {
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-family: inherit;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
    }
    .btn:active { filter: brightness(0.85); }
    .btn_comprar {
        flex: 1 1 auto;
        background-color: #FFCC80; /* laranja claro */
        color: #4a2f00;
        min-height: 56px;
        padding: 6px 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        word-break: break-all;
        transition: background-color 0.15s, box-shadow 0.15s;
    }
    .btn_comprar.piscar {
        background-color: #FFA726; /* brilho: houve merge aqui agora */
        box-shadow: 0 0 12px #FFA726;
    }
    .btn_auto {
        flex: 0 0 72px;
        background-color: #9e9e9e; /* cinza quando desligado */
        color: #333;
        font-weight: bold;
        font-size: 13px;
    }
    .btn_auto.ligado {
        background-color: #FB8C00; /* laranja mais forte quando ligado */
        color: #fff;
        box-shadow: inset 0 0 0 3px #fff3;
    }
    #clicker_area {
        flex: 0 0 20%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 8px 0 12px 0;
    }
    #clicker {
        width: 80%;
        height: 100%;
        background-color: #9e9e9e; /* cinza */
        color: #222;
        font-size: 24px;
        font-weight: bold;
        border-radius: 14px;
        touch-action: none; /* impede o navegador de cancelar o toque longo */
    }
</style>
</head>
<body>
<div id="app">
    <div id="saldo_bar">
        <span id="saldo">0</span>
    </div>
    <div id="andares"></div>
    <div id="clicker_area">
        <button id="clicker" class="btn"></button>
    </div>
</div>

<script>
let canvas_tag = 'merge20260720';
let intervalo_clicker_mili = 300; // segurar o dedo: +1 a cada 300ms
let intervalo_auto_mili = 300;    // tique do auto compra

function custo_do_andar(i) {
    // andar 1 custa 2, andar 2 custa 3, andar 3 custa 4...
    return BigInt(i) + 2n;
}

var saldo = 0n;
var andares = []; // [{count: BigInt, auto: boolean}]  indice 0 = andar 1
this.z = null;

/* ============ utilidades de numeros grandes (mesmo esquema do idle.html) ============ */

function toBigInt(value) {
    if (typeof value === 'bigint') return value;
    if (value === null || value === undefined) return 0n;
    if (typeof value === 'number') return BigInt(Math.floor(value));
    if (typeof value === 'boolean') return value ? 1n : 0n;
    const str = value.toString().replace(/_/g, '').replace(/[^0-9-]/g, '');
    if (str === '') return 0n;
    try {
        return BigInt(str);
    } catch (e) {
        console.error(`Erro ao converter '${value}' para BigInt:`, e);
        return 0n;
    }
}

function letraDeIndice(n) {
    // 1->A, 2->B, ..., 26->Z, 27->AA, ... (estilo Excel)
    let resultado = '';
    while (n > 0) {
        n--;
        resultado = String.fromCharCode(65 + (n % 26)) + resultado;
        n = Math.floor(n / 26);
    }
    return resultado;
}

function formatarNumero(numero) {
    if ((numero + '') === '') return '';
    const num = toBigInt(numero);
    const negativo = num < 0n;
    const absNum = negativo ? -num : num;
    const str = absNum.toString();

    const grupos = [];
    let restante = str.length;
    while (restante > 0) {
        const inicio = Math.max(0, restante - 9);
        grupos.unshift(str.slice(inicio, restante));
        restante -= 9;
    }

    if (grupos.length > 0) {
        const primeiroGrupo = grupos[0];
        let formatado = '';
        for (let i = primeiroGrupo.length; i > 0; i -= 3) {
            const inicio = Math.max(0, i - 3);
            const bloco = primeiroGrupo.slice(inicio, i);
            formatado = bloco + (formatado ? '_' + formatado : '');
        }
        grupos[0] = formatado;
    }

    let resultado;
    const blocosDeNove = grupos.length - 1;
    if (blocosDeNove >= 2) {
        const extras = blocosDeNove - 1;
        resultado = grupos[0] + '_' + grupos[1] + '_' + letraDeIndice(extras);
    } else {
        resultado = grupos.join('_');
    }
    return negativo ? '-' + resultado : resultado;
}

/* ============ persistencia ============ */

// WebView de APK pode ter o DOM storage desligado: setItem lança excecao.
// Este wrapper blinda o jogo e usa memoria como fallback.
var memoria_fallback = {};
function ls_get(chave) {
    try { return localStorage.getItem(chave); }
    catch (e) { return memoria_fallback[chave] != null ? memoria_fallback[chave] : null; }
}
function ls_set(chave, valor) {
    try { localStorage.setItem(chave, valor); }
    catch (e) { memoria_fallback[chave] = valor; }
}

function salvar() {
    let estado = {
        saldo: saldo.toString(),
        andares: andares.map(a => ({ count: a.count.toString(), auto: a.auto }))
    };
    ls_set(canvas_tag, JSON.stringify(estado));
}

function carregar() {
    let raw = ls_get(canvas_tag);
    if (raw == null || raw === '') return;
    try {
        let estado = JSON.parse(raw);
        saldo = toBigInt(estado.saldo);
        andares = (estado.andares || []).map(a => ({ count: toBigInt(a.count), auto: !!a.auto }));
    } catch (e) {
        console.error('Erro ao carregar estado:', e);
    }
}

z = function () {
    // javascript:z('')  apaga o historico e recomeça
    ls_set(canvas_tag, '');
    location.reload();
}
console.log("apaga historico==>\njavascript:z('')");

/* ============ regras do jogo ============ */

function origem_do_andar(i) {
    // andar 0 (primeiro) compra do saldo; os demais compram do andar de baixo
    if (i === 0) return saldo;
    return andares[i - 1].count;
}

function debitar_origem(i, valor) {
    if (i === 0) saldo -= valor;
    else andares[i - 1].count -= valor;
}

function pode_comprar(i) {
    return origem_do_andar(i) >= custo_do_andar(i);
}

var timers_piscar = {};
function piscar(i) {
    const btn = document.getElementById('comprar' + i);
    if (btn == null) return;
    btn.classList.add('piscar');
    if (timers_piscar[i] != null) clearTimeout(timers_piscar[i]);
    timers_piscar[i] = setTimeout(function () {
        btn.classList.remove('piscar');
        timers_piscar[i] = null;
    }, 180);
}

function comprar(i) {
    if (!pode_comprar(i)) return false;
    debitar_origem(i, custo_do_andar(i));
    andares[i].count += 1n;
    piscar(i); // mostra que houve merge aqui, mesmo que ja processado
    return true;
}

function garantir_novos_andares() {
    // primeiro andar surge quando ha saldo suficiente pela primeira vez
    if (andares.length === 0 && saldo >= custo_do_andar(0)) {
        andares.push({ count: 0n, auto: false });
    }
    // um novo andar surge quando o andar do topo ja tem material para o merge dele
    while (andares.length > 0 && andares[andares.length - 1].count >= custo_do_andar(andares.length)) {
        andares.push({ count: 0n, auto: false });
    }
}

/* ============ interface ============ */

const el_saldo = document.getElementById('saldo');
const el_andares = document.getElementById('andares');
const el_clicker = document.getElementById('clicker');

function criar_andar_dom(i) {
    const row = document.createElement('div');
    row.className = 'andar';
    row.id = 'andar' + i;

    const btn = document.createElement('button');
    btn.className = 'btn btn_comprar';
    btn.id = 'comprar' + i;
    btn.innerHTML = '<span class="linha2"></span>';
    btn.addEventListener('click', function () {
        comprar(i);
        garantir_novos_andares();
        atualizar_tudo();
        salvar();
    });

    const auto = document.createElement('button');
    auto.className = 'btn btn_auto';
    auto.id = 'auto' + i;
    auto.textContent = 'AUTO';
    auto.addEventListener('click', function () {
        andares[i].auto = !andares[i].auto;
        atualizar_andar(i);
        salvar();
    });

    row.appendChild(btn);
    row.appendChild(auto);
    el_andares.appendChild(row);
}

function atualizar_andar(i) {
    const a = andares[i];
    const btn = document.getElementById('comprar' + i);
    const auto = document.getElementById('auto' + i);
    btn.children[0].textContent = formatarNumero(a.count);
    if (a.auto) auto.classList.add('ligado');
    else auto.classList.remove('ligado');
}

function atualizar_tudo() {
    el_saldo.textContent = modo_confirmar ? 'APAGAR?' : formatarNumero(saldo);
    for (let i = 0; i < andares.length; i++) {
        if (document.getElementById('andar' + i) == null)
            criar_andar_dom(i);
        atualizar_andar(i);
    }
}

/* ============ clicker: toque unico e segurar o dedo ============ */

var timer_clicker = null;

function clicar() {
    saldo += 1n;
    garantir_novos_andares();
    atualizar_tudo();
}

function comeca_segurar(e) {
    if (e && e.cancelable) e.preventDefault(); // impede toque longo de virar gesto do navegador
    if (timer_clicker != null) return;
    clicar(); // primeiro +1 imediato
    timer_clicker = setInterval(clicar, intervalo_clicker_mili);
}

function para_segurar() {
    if (timer_clicker == null) return;
    clearInterval(timer_clicker);
    timer_clicker = null;
    salvar();
}

// mesmo esquema do idle.html: touch no celular/WebView, mouse no desktop.
// Pointer Events nao sao confiaveis em WebView de APK.
if ('ontouchstart' in window) {
    el_clicker.addEventListener('touchstart', comeca_segurar, false);
    el_clicker.addEventListener('touchend', para_segurar, false);
    el_clicker.addEventListener('touchcancel', para_segurar, false);
} else {
    el_clicker.addEventListener('mousedown', comeca_segurar, false);
    el_clicker.addEventListener('mouseup', para_segurar, false);
    el_clicker.addEventListener('mouseleave', para_segurar, false);
}
el_clicker.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ============ reset escondido: segurar o saldo por 3 segundos ============ */
/* sem confirm() nativo: a confirmacao acontece no proprio saldo (vira APAGAR? vermelho) */

var timer_reset = null;
var timer_volta = null;
var modo_confirmar = false;

function executa_reset() {
    modo_confirmar = false;
    el_saldo.classList.remove('confirmar');
    saldo = 0n;
    andares = [];
    el_andares.innerHTML = '';
    ls_set(canvas_tag, '');
    atualizar_tudo(); // ja zera na tela, mesmo se o reload falhar
    try { location.reload(); } catch (e) {}
}

function sai_do_modo_confirmar() {
    modo_confirmar = false;
    el_saldo.classList.remove('confirmar');
    if (timer_volta != null) { clearTimeout(timer_volta); timer_volta = null; }
    atualizar_tudo();
}

function comeca_reset(e) {
    if (e && e.cancelable) e.preventDefault();
    if (modo_confirmar) {
        // segundo toque em cima do APAGAR? = confirmou
        executa_reset();
        return;
    }
    if (timer_reset != null) return;
    timer_reset = setTimeout(function () {
        timer_reset = null;
        modo_confirmar = true;
        el_saldo.classList.add('confirmar');
        el_saldo.textContent = 'APAGAR?';
        // sem confirmacao em 5s, volta ao normal
        timer_volta = setTimeout(sai_do_modo_confirmar, 5000);
    }, 3000);
}

function cancela_reset() {
    if (timer_reset == null) return;
    clearTimeout(timer_reset);
    timer_reset = null;
}

if ('ontouchstart' in window) {
    el_saldo.addEventListener('touchstart', comeca_reset, false);
    el_saldo.addEventListener('touchend', cancela_reset, false);
    el_saldo.addEventListener('touchcancel', cancela_reset, false);
    el_saldo.addEventListener('touchmove', cancela_reset, false);
} else {
    el_saldo.addEventListener('mousedown', comeca_reset, false);
    el_saldo.addEventListener('mouseup', cancela_reset, false);
    el_saldo.addEventListener('mouseleave', cancela_reset, false);
}
el_saldo.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ============ auto compra ============ */

setInterval(function () {
    let mudou = false;
    // da base para o topo, comprando tudo que der em cada andar:
    // assim um unico tique faz a cadeia inteira fluir para cima
    for (let i = 0; i < andares.length; i++) {
        if (!andares[i].auto) continue;
        while (comprar(i))
            mudou = true;
        garantir_novos_andares();
    }
    if (mudou) {
        atualizar_tudo();
        salvar();
    }
}, intervalo_auto_mili);

/* ============ inicio ============ */

carregar();
garantir_novos_andares();
atualizar_tudo();
</script>
</body>
</html>
